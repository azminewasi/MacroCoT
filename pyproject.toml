[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macrocot"
version = "0.1.0"
description = "Shorter chains via macro transitions: speedup theorems for chain-of-thought counter simulation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["macrocot*"]
